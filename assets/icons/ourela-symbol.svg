<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 68 48" role="img" aria-label="OURELA-IA">
  <defs>
    <linearGradient id="ourelaBronze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7c9a3"/>
